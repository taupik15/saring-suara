name: Deploy Saring Suara + GTCRN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/install-gtcrn.sh scripts/gtcrn-worklet-entry.js scripts/install-rnnoise.sh scripts/rnnoise-vad-worklet-entry.js scripts/install-uvr-lite.sh app.js index.html voice-worklet.js gtcrn-filter.js rnnoise-filter.js speech-gate.js speech-gate-worklet.js uvr-live.js uvr-live-worker.js uvr-tap-worklet.js tests/fix20.test.cjs; do
            test -s "$f" || { echo "Missing: $f"; exit 1; }
          done

      - name: Build GTCRN assets
        run: bash scripts/install-gtcrn.sh

      - name: Build RNNoise VAD assets
        run: bash scripts/install-rnnoise.sh

      - name: Package lightweight UVR 9482 assets
        run: bash scripts/install-uvr-lite.sh

      - name: Validate JavaScript and models
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js voice-worklet.js gtcrn-filter.js rnnoise-filter.js speech-gate.js speech-gate-worklet.js uvr-live.js uvr-live-worker.js uvr-tap-worklet.js vendor-gtcrn/gtcrn-worklet.js vendor-rnnoise/rnnoise-vad-worklet.js; do node --check "$f"; done
          test -s vendor-gtcrn/gtcrn.wasm
          test -s vendor-rnnoise/rnnoise.wasm
          test -s vendor-uvr/UVR_MDXNET_9482.onnx
          node -e "const fs=require('fs');for(const f of ['vendor-gtcrn/gtcrn.wasm','vendor-rnnoise/rnnoise.wasm'])if(!WebAssembly.validate(fs.readFileSync(f)))process.exit(1)"
          node --test tests/fix20.test.cjs

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saring-site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='tests/' \
            --exclude='*.zip' --exclude='*.md' --exclude='WORKFLOW-*.txt' ./ "$RUNNER_TEMP/saring-site/"
          for f in index.html uvr-live.js uvr-live-worker.js uvr-tap-worklet.js vendor-uvr/UVR_MDXNET_9482.onnx; do test -s "$RUNNER_TEMP/saring-site/$f"; done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/saring-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to propagate
        run: sleep 20

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
