
name: Deploy Saring Suara + GTCRN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required source files
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/install-gtcrn.sh
          test -s scripts/gtcrn-worklet-entry.js
          test -s gtcrn-filter.js
          test -s app.js
          test -s voice-worklet.js
          test -s index.html

      - name: Build local GTCRN AI assets
        shell: bash
        run: bash scripts/install-gtcrn.sh

      - name: Validate JavaScript, WASM and UI integration
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check gtcrn-filter.js
          node --check voice-worklet.js
          node --check vendor-gtcrn/gtcrn-worklet.js
          test -s vendor-gtcrn/gtcrn.wasm
          test -s vendor-gtcrn/gtcrn-worklet.js
          node <<'NODE'
          const fs = require('node:fs');
          const wasm = fs.readFileSync('vendor-gtcrn/gtcrn.wasm');
          if (!WebAssembly.validate(wasm)) throw Error('GTCRN WASM is invalid');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('gtcrn-filter.js')) throw Error('GTCRN script missing from index.html');
          console.log('GTCRN WASM, UI and JavaScript checks passed');
          NODE

      - name: Run optional project tests when uploaded
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/fix16.test.cjs ]; then
            node --test tests/fix16.test.cjs
          else
            echo 'NOTICE: tests/fix16.test.cjs is missing from repository; upload it from the Fix 1.6 ZIP for full QA.'
          fi
          if [ -f tests/resume-voice-test.cjs ]; then
            node tests/resume-voice-test.cjs
          else
            echo 'NOTICE: tests/resume-voice-test.cjs is missing from repository; upload it from the Fix 1.6 ZIP for full QA.'
          fi

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saring-site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='tests/' \
            --exclude='*.zip' --exclude='*.md' ./ "$RUNNER_TEMP/saring-site/"
          test -s "$RUNNER_TEMP/saring-site/index.html"
          test -s "$RUNNER_TEMP/saring-site/vendor-gtcrn/gtcrn.wasm"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/saring-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
